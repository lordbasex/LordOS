# LordOS: shared memory gets transparent huge pages only where it asks for them (MADV_HUGEPAGE), which QEMU does on
# a machine's memory; tmpfs, /dev/shm and other shared memory stay on 4 KB pages (docs/VIRTUALIZATION.md 3.7.2).
# The kernel's default is "never". To keep another value, put a file of the same name in /etc/tmpfiles.d (an empty
# one keeps the kernel's own). Skipped on a kernel without transparent huge pages (the file isn't there).
w /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - advise
