# LordOS Machines: a shutdown or restart of this computer waits up to 30 s for running machines to be saved to disk
# (each lord-vm holds a logind "delay" inhibitor and suspends its machine on PrepareForShutdown; docs/VIRTUALIZATION.md
# 6.1). logind's default is 5 s, too short to write a guest's memory.
[Login]
InhibitDelayMaxSec=30
