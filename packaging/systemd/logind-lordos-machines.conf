# LordOS Machines: a shutdown or restart of this computer waits up to 45 s for running machines to be saved to disk
# (each lord-vm holds a logind "delay" inhibitor and suspends its machine on PrepareForShutdown; docs/VIRTUALIZATION.md
# 6.1). logind's default is 5 s, too short to write a guest's memory. 45 s (30 s until 0.8.9.5): a machine that can't
# be saved (a graphics card, 3D graphics) shuts down its own way, and a guest's ACPI shutdown can take half a minute;
# it gets until +41 s (server/src/vm/vmhoststop.h).
[Login]
InhibitDelayMaxSec=45
