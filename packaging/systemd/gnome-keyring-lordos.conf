# LordOS: the Secret Service (org.freedesktop.secrets) is LordOS's own keyring, lord-vault
# (docs/PASSWORDS.md). gnome-keyring, when some app pulls it in, keeps only its PKCS#11 component
# (certificates for NSS), so it never takes the name and never asks for a "Default Keyring" password
# with its own prompter. Its D-Bus activation file only runs when nobody owns the name, and
# lord-vault owns it for the whole session.
[Service]
ExecStart=
ExecStart=/usr/bin/gnome-keyring-daemon --foreground --components=pkcs11 --control-directory=%t/keyring
