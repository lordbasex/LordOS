# LordOS's defaults for GTK 3 and GTK 4 apps (installed as /etc/gtk-3.0/settings.ini and
# /etc/gtk-4.0/settings.ini by the lordos package). Lowest priority: on Wayland GTK takes these settings
# from GSettings or the settings portal, which lord-server keeps in step with the theme, and a user's
# ~/.config/gtk-3.0/settings.ini wins. They matter for apps that run on X11 (Xwayland), where GTK reads
# only XSETTINGS, which LordOS doesn't serve: without this line they show only a close button (#52).
[Settings]
gtk-decoration-layout=close,minimize,maximize:
