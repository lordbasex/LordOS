# Hardware reports (0.8.7, docs/BENCHMARK.md "0.8.7 — Community hardware reports"). When an issue made with the
# hardware-report template is opened or edited, tools/hwreport/validate.mjs downloads the attached report from
# GitHub's attachment hosts, validates it against apps/sysinfo/hwreport.schema.json, checks that its numbers are
# plausible against the reference machines, comments the result and labels the issue by kind and vendor.
#
# Everything in the issue is untrusted. No issue text is ever put into this file's expressions or a shell: the
# script reads the event file GitHub writes. The token can only read the code and write issues. The action is
# pinned by commit. Workflows for `issues` events run from the default branch, so this one works once it is
# on main.
name: Hardware report check
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read      # check out the validator and the schema (read-only)
  issues: write       # comment and label

concurrency:
  group: hwreport-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.issue.pull_request && contains(github.event.issue.labels.*.name, 'hardware-report') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/hwreport
            apps/sysinfo
          sparse-checkout-cone-mode: true
      - name: Check the attached report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/hwreport/validate.mjs --github
