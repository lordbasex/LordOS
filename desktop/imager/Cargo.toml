# LordOS Imager for the three desktop platforms (docs/IMAGER.md, "The desktop app"): a Tauri shell
# (src-tauri) around the same React UI as the native app, and the writer in a library (core) that
# is tested on its own.
[workspace]
members = ["core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.8.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/lordbasex/LordOS"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
