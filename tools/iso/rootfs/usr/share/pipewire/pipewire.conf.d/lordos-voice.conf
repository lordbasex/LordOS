# LordOS: Voice Isolation, the microphone mode of LordOS Studio's camera popover (docs/CAMERA-STUDIO-PLAN.md 7;
# AGENTS.md, "LordOS Studio's Voice Isolation", E-S6).
#
# PipeWire's own echo-cancel module with WebRTC Audio Processing (libspa-aec-webrtc, already in Debian's
# libspa-0.2-modules; BSD-3) makes one more microphone, "LordOS Voice Isolation": noise suppression, transient
# suppression, a high-pass filter and automatic gain on the chosen microphone. Nothing else is loaded, no command runs:
# the Mic Mode buttons only choose the default microphone through lord-server's PulseAudio client (sdk/studiomodel.js
# micPlan), and move this filter's capture to the microphone the person uses.
#
# Echo cancellation itself works only on what plays through its "echo reference" output, and nothing is sent there:
# Voice Isolation is noise suppression without echo cancellation (the maintainer's decision D8). The filter's own
# capture stream is not an app's use of the microphone; the app that records "LordOS Voice Isolation" is, and the
# capture indicator names that one (server/src/sec/pwguard.c). A Linux app restricted from the microphone never sees
# this source either: the PipeWire guard hides every Audio/Source from it.

context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = false
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.transient_suppression = true
                webrtc.gain_control = true
                webrtc.voice_detection = false
            }
            capture.props = {
                node.name = "lordos_voice_capture"
                media.name = "lordos_voice_capture"
                node.description = "LordOS Voice Isolation (microphone in)"
            }
            source.props = {
                node.name = "lordos_voice_isolation"
                node.description = "LordOS Voice Isolation"
                priority.session = 1
            }
            sink.props = {
                node.name = "lordos_voice_reference"
                node.description = "LordOS Voice Isolation (echo reference)"
                priority.session = 1
                node.passive = true
            }
            playback.props = {
                node.name = "lordos_voice_playback"
                node.passive = true
            }
        }
    }
]
