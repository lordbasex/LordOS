# LordOS: a Bluetooth headset stays in high-fidelity playback (A2DP) until the user chooses its
# microphone (issue #78; docs/SOUND.md, "Bluetooth headsets").
#
# By default WirePlumber 0.5 gives a headset a virtual input (bluez_input.<address>, priority 2010,
# above a built-in microphone, so it becomes the default input) and switches the headset to headset
# mode (HSP/HFP, audio over SCO) as soon as any stream records from it: even the microphone meter of
# Settings -> Sound. Its output then becomes the low-quality SCO one, and on adapters whose SCO audio
# is broken the headset goes silent (kernel: "corrupted SCO packet", "SCO packet for unknown
# connection handle").
#
# With the switch off WirePlumber keeps the profile it chose when the headset connected (the highest
# priority available one: A2DP), creates no virtual input, and LordOS changes the profile itself:
# headset mode when the headset's microphone is chosen in Settings -> Sound, high fidelity when it is
# chosen as the output or another microphone is chosen (sdk/btaudiomodel.js).
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
