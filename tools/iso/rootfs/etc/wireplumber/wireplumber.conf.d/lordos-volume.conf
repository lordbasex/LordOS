# LordOS: an output starts at 80 % (docs/SOUND.md, "Volume"), not WirePlumber's 40 %.
#
# The value is linear and the sliders are cubic: 0.8 x 0.8 x 0.8 = 0.512, about 6 dB under full scale,
# which leaves room for loud sound. Measured with a full-scale 1 kHz tone: no clipped samples at 80 %
# or 100 %, and a third of them clipped at 108 %. Only a new output takes it; a saved volume stays.
wireplumber.settings = {
  device.routes.default-sink-volume = 0.512
}
