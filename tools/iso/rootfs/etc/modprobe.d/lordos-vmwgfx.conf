# LordOS: load vmwgfx only on VMware itself and on VirtualBox (innotek), whose VMSVGA display is its default for Linux (docs/ISO.md, "Firmware and displays").
# QEMU's VMware-compatible display (Proxmox "VMware compatible") has the same PCI id, but vmwgfx
# refuses it ("unsupported hypervisor", "no pitchlock") after removing the firmware framebuffer,
# which left no display at all: not even the text console that explains what is missing. On VMware
# (DMI vendor "VMware, Inc.") the driver loads as usual. Also applies in the initramfs.
install vmwgfx if grep -qiE 'vmware|innotek' /sys/class/dmi/id/sys_vendor 2>/dev/null; then /sbin/modprobe --ignore-install vmwgfx $CMDLINE_OPTS; fi
